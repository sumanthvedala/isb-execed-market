<title>Exec Ed Market Brief</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: an editorial brief. One reading column for statements, a wider
   measure for lists. Whitespace and hairlines group things; nothing is boxed.
   One accent, ISB blue, and it only ever marks ISB. */
:root{
  --paper:#FBFCFE; --ink:#12152B; --ink-2:#454A63; --ink-3:#6B7089; --rule:#E2E5EE; --wash:#F2F4F9;
  --isb:#192890;            /* ISB deep blue: replace with the official brand hex */
  --isb-wash:#E6ECFF; --isb-hover:#D2DCFF;
  /* call labels: validated as an ordered set (Lead to Defend), white text on each */
  --lead:#047857; --diversify:#5B21B6; --follow:#0369A1; --deepen:#B45309; --defend:#A21CAF; --watch:#475569;
  --prob:#FFF2CC;           /* the register's own "probable" shading */
  --serif:Newsreader,"Iowan Old Style",Georgia,serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --t1:clamp(32px,5vw,46px); --t2:clamp(21px,2.6vw,26px); --t3:16px; --t4:13px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D0F1C; --ink:#ECEEF6; --ink-2:#B9BED3; --ink-3:#8A90AA; --rule:#262A40; --wash:#151829;
  --isb:#A5B1FF; --isb-wash:#1E2550; --isb-hover:#2A3370; --prob:#3A3115; --diversify:#6D28D9; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D0F1C; --ink:#ECEEF6; --ink-2:#B9BED3; --ink-3:#8A90AA; --rule:#262A40; --wash:#151829;
  --isb:#A5B1FF; --isb-wash:#1E2550; --isb-hover:#2A3370; --prob:#3A3115; --diversify:#6D28D9; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font:400 var(--t3)/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--isb);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.isb{color:var(--isb)}
.meta{font-size:var(--t4);color:var(--ink-3)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:24px}
.read{max-width:720px}

/* masthead */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.mast{display:flex;align-items:center;gap:14px 22px;padding-block:12px;flex-wrap:wrap}
.brand{font-size:var(--t4);letter-spacing:.01em;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.brand b{color:var(--isb);font-weight:600}
nav.main{order:3;flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap}
nav.main a{text-decoration:none;font-size:15px;font-weight:500;color:var(--isb);background:var(--isb-wash);padding:9px 18px;border-radius:999px;transition:background .12s}
nav.main a:hover{background:var(--isb-hover)}
nav.main a.on{background:var(--isb);color:var(--paper)}
nav.main a.first{font-weight:600}
body.home .find{visibility:hidden}
.find{margin-left:auto;position:relative;flex:1 1 200px;max-width:300px;min-width:160px}
.find input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:6px 10px;font-size:14px}
.find kbd{position:absolute;right:8px;top:7px;font:11px var(--mono);color:var(--ink-3)}
.hits{position:absolute;right:0;top:calc(100% + 6px);width:min(520px,92vw);background:var(--paper);border:1px solid var(--rule);
  border-radius:8px;box-shadow:0 18px 40px -24px rgba(10,14,40,.35);max-height:70vh;overflow:auto;padding-block:6px}
.hits .g{font-size:12px;color:var(--ink-3);padding:8px 14px 2px}
.hits a{display:block;padding:6px 14px;text-decoration:none}
.hits a:hover,.hits a.on{background:var(--wash)}
.hits a span{display:block;font-size:12px;color:var(--ink-3)}
@media (max-width:760px){header.top{position:static}.find{order:2;flex-basis:100%;max-width:none;margin-left:0}
  body.home .find{display:none}
  nav.main{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;max-width:100%;padding-bottom:4px}nav.main a{font-size:14px;padding:8px 14px}.find kbd{display:none}}

main{padding-block:44px 80px}
h1{font:500 var(--t1)/1.08 var(--serif);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
h2{font:500 var(--t2)/1.2 var(--serif);margin:0 0 6px;text-wrap:balance}
p{margin:0 0 12px}
section{margin-top:56px;scroll-margin-top:84px}
section>header{border-top:1px solid var(--ink);padding-top:10px;margin-bottom:18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
section>header h2{font-size:22px}
.kicker{font-size:var(--t4);color:var(--ink-3);margin-bottom:22px}

/* brief */
.lead{font:400 var(--t2)/1.38 var(--serif);margin:0 0 6px;text-wrap:pretty}
.lead b{font-weight:600}
.st{padding-block:22px;border-top:1px solid var(--rule)}
.st.first{border-top:0;padding-top:4px}
.st .lead{font-size:22px}
.st a.go{font-size:var(--t4);color:var(--ink-2)}
.st.first .lead{font-size:clamp(28px,3.6vw,36px);line-height:1.22}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:48px;border-top:1px solid var(--ink);padding-top:16px}
.doors a{text-decoration:none;display:block}
.doors a b{display:block;font:500 20px/1.25 var(--serif);margin-bottom:4px}
.doors a:hover b{text-decoration:underline;text-underline-offset:4px}
.doors a span{font-size:14px;color:var(--ink-2)}
@media (max-width:760px){.doors{grid-template-columns:1fr;gap:18px}}

/* rows: the one list pattern used everywhere */
.rows{border-top:1px solid var(--rule)}
.r{display:grid;grid-template-columns:var(--cols,minmax(0,1fr) 110px 110px 90px 90px);gap:14px;align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--rule);text-decoration:none}
a.r:hover{background:var(--wash)}
.r .n{font-weight:500;line-height:1.35;font-size:16px}
.r .s{font-size:var(--t4);color:var(--ink-3);margin-top:2px}
.r .c{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.r.hd{font-size:12px;color:var(--ink-3);padding-block:6px}
.r.hd button{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
.r.hd button.on{color:var(--ink)}
.r.isbrow .n{color:var(--isb)}
.r.prob{background:var(--prob)}
details.r{display:block}
details.r>summary{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:baseline;cursor:pointer;list-style:none}
details.r>summary::-webkit-details-marker{display:none}
.mark{font:italic 13px var(--serif);color:var(--ink-2);margin-left:6px;white-space:nowrap}
@media (max-width:760px){.r,details.r>summary{grid-template-columns:minmax(0,1fr) auto}.r .hm{display:none}.r.hd{display:none}}

/* controls: text buttons, not pills */
.tools{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.tabs{display:flex;gap:16px;flex-wrap:wrap}
.tabs{gap:8px}
.tabs button{appearance:none;cursor:pointer;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 15px;font-size:14px}
.tabs button:hover{background:var(--isb-wash)}
.tabs button.on{background:var(--isb);border-color:var(--isb);color:var(--paper)}
.tabs button.on .meta{color:inherit;opacity:.8}
select,input[type=text],input[type=number],input[type=search],textarea{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:6px 9px;font-size:14px;max-width:100%}
label.ck{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.lnk{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);font-size:14px;color:var(--ink-2)}

/* call labels */
.call{display:inline-block;font:600 13px/1 var(--sans);letter-spacing:.02em;color:#fff;background:var(--cc,var(--watch));
  padding:6px 11px;border-radius:999px;vertical-align:3px;white-space:nowrap}
.cl-LEAD{--cc:var(--lead)}.cl-DIVERSIFY{--cc:var(--diversify)}.cl-FOLLOW{--cc:var(--follow)}.cl-DEEPEN{--cc:var(--deepen)}
.cl-DEFEND{--cc:var(--defend)}.cl-WATCH,.cl-REVIEW{--cc:var(--watch)}
h2 .call{font-size:15px;padding:7px 14px;vertical-align:4px}
/* search */
.hero{max-width:980px}
.hero h1{margin-bottom:8px}
.about{border-left:4px solid var(--isb);padding:2px 0 2px 18px;margin:0 0 30px;max-width:860px}
.about .tagline{font:600 clamp(26px,3.4vw,34px)/1.15 var(--serif);letter-spacing:-.01em;color:var(--isb);margin:0 0 10px;text-wrap:balance}
.about p{font:400 clamp(18px,2vw,21px)/1.45 var(--serif);color:var(--ink);margin:0}
.big{display:flex;gap:10px;margin:22px 0 14px}
.big input{flex:1;min-width:0;font-size:18px;padding:14px 18px;border:2px solid var(--isb);border-radius:14px;background:var(--paper)}
.btn{appearance:none;border:0;cursor:pointer;background:var(--isb);color:var(--paper);font-weight:600;font-size:16px;padding:0 24px;border-radius:14px}
.btn:hover{filter:brightness(1.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-3)}
.chip{appearance:none;border:0;cursor:pointer;background:var(--isb-wash);color:var(--isb);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;text-decoration:none}
.chip:hover{background:var(--isb-hover)}
.pill{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.pill.on{border-color:var(--isb);background:var(--isb-wash);color:var(--isb);font-weight:500}
label.pillck{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
label.pillck.on{border-color:var(--lead);color:var(--lead);font-weight:500}
.newtag{display:inline-block;font:600 11.5px/1 var(--sans);color:var(--lead);border:1.5px solid var(--lead);border-radius:999px;padding:3px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.newtag.prob{color:var(--deepen);border-color:var(--deepen)}
.explain{font-size:14px;color:var(--ink-2);background:var(--wash);border-radius:10px;padding:12px 16px;margin:14px 0;max-width:760px}
.steps{display:flex;gap:10px 26px;flex-wrap:wrap;margin:14px 0 26px;font-size:15px}
.steps span b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--isb);color:var(--paper);font-size:13px;margin-right:8px}
/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 28px;margin:22px 0}
.facts div{border-top:1px solid var(--rule);padding-top:8px}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-size:15px}
.facts dd.none{color:var(--ink-3);font-style:italic}

/* charts */
svg text{font:12px var(--sans);fill:var(--ink-3)}
.strip{width:100%;height:auto;display:block;margin:6px 0 4px}
.weights .w{display:grid;grid-template-columns:minmax(120px,230px) 1fr 54px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.weights .tr{position:relative;height:14px}
.weights .tr i{position:absolute;top:6px;height:1px;background:var(--ink-3)}
.weights .tr b{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;margin-left:-5px}
@media (max-width:560px){.weights .w{grid-template-columns:110px 1fr 44px;font-size:12.5px}}

/* test a programme */
.test{display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;align-items:start}
.test form{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.test label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.test .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.test input,.test select,.test textarea{width:100%;min-width:0}
@media (max-width:860px){.test{grid-template-columns:1fr;gap:28px}.test form{position:static}}

details.fold{border-top:1px solid var(--rule);padding-top:10px;margin-top:22px}
details.fold summary{cursor:pointer;color:var(--ink-2);font-size:14px}
.cov td,.cov th{padding:6px 8px;text-align:right;border-bottom:1px solid var(--rule);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cov th{font-weight:500;font-size:12px;color:var(--ink-3)}
.cov td:first-child,.cov th:first-child{text-align:left;white-space:normal}
.cov td.i{color:var(--isb);font-weight:600}
.cov tr.sub td{color:var(--ink-2);font-size:13px}
.cov tr.sub td:first-child{padding-left:22px}
.cov tr.th td:first-child{cursor:pointer}
.scroll{overflow-x:auto}
footer{border-top:1px solid var(--rule);margin-top:72px;padding-block:20px 40px;font-size:13px;color:var(--ink-3)}
footer p{max-width:78ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const D = __DATA__;
/* ---------- basics ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SC=Object.fromEntries(D.schools.map(s=>[s.s,s]));
const T=Object.fromEntries(D.topics.map(t=>[t.id,t]));
D.progs.forEach((p,i)=>p.i=i);
const LV=l=>l==="Senior"?"C-suite/Senior":l;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const lakh=v=>v==null?"not published":v>=1e7?"₹"+(v/1e7).toFixed(2)+" Cr":"₹"+(v/1e5).toFixed(v<1e6?2:1)+" L";
const wk=w=>w==null?"not published":w<1?Math.round(w*5)+" days":w<9?(+w.toFixed(1))+" weeks":Math.round(w/4.33)+" months";
const fmtD=s=>{if(!s)return"";const d=new Date((s.length===7?s+"-01":s)+"T00:00:00");return isNaN(d)?s:
  d.toLocaleDateString("en-GB",s.length===7?{month:"short",year:"numeric"}:{day:"numeric",month:"short",year:"numeric"});};
const addM=(iso,m)=>{const d=new Date(iso+"T00:00:00");d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10);};
const words=q=>q.toLowerCase().split(/[\s,]+/).filter(Boolean);
const ALIAS={cfo:"chief financial",ceo:"chief executive",cmo:"chief marketing",cto:"chief technology",coo:"chief operat",
  chro:"chief human",cso:"chief strategy",cdo:"chief digital",caio:"chief ai",hr:"human resource",pe:"private equity",
  vc:"venture capital",esg:"sustainab",gm:"general management"};
const has=(hay,w)=>hay.includes(w)||(ALIAS[w]&&hay.includes(ALIAS[w]));
const hit=(hay,q)=>words(q).every(w=>has(hay,w));
const plural=(n,a,b)=>`${n} ${n===1?a:(b||a+"s")}`;
const isAI=s=>/\bai\b|artificial intelligence|agentic|gen ?ai|generative/i.test(s);
// calls in words: what they mean, said plainly
const CALL={LEAD:"Lead",DIVERSIFY:"Diversify",FOLLOW:"Follow",DEEPEN:"Deepen",DEFEND:"Defend",WATCH:"Watch",REVIEW:"Review"};
const CALLSAYS={
  LEAD:"ISB does not sell this. Research shows demand, and few or no other schools sell it.",
  DIVERSIFY:"ISB does not sell this, but sells something close to it. Other schools have proven the market.",
  FOLLOW:"ISB does not sell this. Many other schools do, and research shows demand.",
  DEEPEN:"ISB sells this, demand is strong and few other schools compete. There is room to own it.",
  DEFEND:"ISB sells this, and so do many other schools, in a topic with strong demand.",
  WATCH:"Many other schools sell this, but little research shows demand.",
  REVIEW:"ISB sells this, but little research shows demand and few other schools sell it. Check enrolments before deciding."};
const pill=c=>c?`<span class="call cl-${c}">${CALL[c]}</span>`:"";
const callLine=t=>t.call?`${pill(t.call)} ${CALLSAYS[t.call]}`:`No call yet: not enough demand evidence or activity by other schools to make one.`;
// "demand" said in words: the score is how much published research says
// employers and executives need this (2 per independent report up to 5,
// 1 per region, 2 if it concerns senior people)
const DEM=t=>t.dem>=13?"Strong":t.dem>=8?"Moderate":t.dem>0?"Some":"No";
const demText=t=>t.dem?`${DEM(t)} demand, from ${plural(t.srcs,"independent report")}`:"No published research found";
const DEM_EXPLAIN=`<b>What “demand” means here.</b> How strongly published research (World Economic Forum, LinkedIn, Naukri, employer surveys, regulators) says employers and executives need this skill. <i>Strong</i> means several independent reports across regions say so; <i>some</i> means one or two. It is not ISB enrolment data.`;
const movedCall=Object.fromEntries(((D.changes||{}).calls||[]).map(([id,o,n])=>[id,[o,n]]));

/* closest peer programmes: same topic first, then secondary, then sub-theme;
   format, level and length break ties */
function closest(p,k=10){
  const t=T[p.t];
  return D.progs.filter(q=>q.sc!==p.sc&&q!==p).map(q=>{const u=T[q.t];let s=0;
    if(q.t===p.t)s+=4;else if(q.sec===p.t||q.t===p.sec)s+=3;else if(u.st===t.st)s+=2;else return null;
    if(q.f===p.f)s+=1; if(LV(q.lv)===LV(p.lv)&&p.lv!=="Unknown")s+=1;
    if(p.w&&q.w){const r=Math.max(p.w,q.w)/Math.min(p.w,q.w);s+=r<1.5?1.5:r<3?.5:0;}
    return [s,q];}).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>x[1]);
}
// ISB's presence on a topic: programmes sold as it, and programmes that only
// teach it as a module. Calls count the first; saying "ISB has 1 here" about
// the second contradicts a call that says ISB does not sell it.
function isbOn(id){const a=D.progs.filter(p=>p.sc==="isb");return {sold:a.filter(p=>p.t===id),part:a.filter(p=>p.t!==id&&p.sec===id)};}
const isbSay=o=>o.sold.length?`ISB already sells ${plural(o.sold.length,"programme")} here.`:o.part.length?`ISB covers it only as a module, inside ${plural(o.part.length,"programme")} sold as something else.`:"";
const pctile=(v,arr)=>Math.round(100*arr.filter(x=>x<v).length/arr.length);

/* price strip: one dot per programme on a log scale of INR, ISB in blue */
function strip(list,mark){
  const pts=list.filter(p=>p.inr).map(p=>({v:p.inr,isb:p.sc==="isb",n:p.n,s:SC[p.sc]?SC[p.sc].l:""}));
  if(mark) pts.push({v:mark,me:1});
  if(pts.length<2) return "";
  const lo=Math.min(...pts.map(p=>p.v))*0.8, hi=Math.max(...pts.map(p=>p.v))*1.25, W=720,H=64,L=10,R=10;
  const x=v=>L+(W-L-R)*(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo));
  const ticks=[5e4,1e5,2.5e5,5e5,1e6,2.5e6,5e6,1e7].filter(v=>v>lo&&v<hi);
  const med=median(pts.filter(p=>!p.me&&!p.isb).map(p=>p.v));
  const anc=v=>x(v)<90?"start":x(v)>W-90?"end":"middle";
  return `<svg class="strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fees of ${pts.length} programmes on a log scale">
    <line x1="${L}" x2="${W-R}" y1="30" y2="30" stroke="var(--rule)"/>
    ${ticks.map(v=>`<line x1="${x(v)}" x2="${x(v)}" y1="26" y2="34" stroke="var(--rule)"/><text x="${x(v)}" y="54" text-anchor="middle">${v>=1e7?"₹"+v/1e7+"Cr":"₹"+v/1e5+"L"}</text>`).join("")}
    ${med?`<line x1="${x(med)}" x2="${x(med)}" y1="14" y2="38" stroke="var(--ink-2)" stroke-dasharray="2 2"/><text x="${x(med)}" y="10" text-anchor="${anc(med)}" style="fill:var(--ink-2)">typical fee ${lakh(med)}</text>`:""}
    ${pts.filter(p=>!p.isb&&!p.me).map(p=>`<circle cx="${x(p.v)}" cy="30" r="4" fill="var(--ink-3)" fill-opacity=".55"><title>${esc(p.s)}: ${esc(p.n)} · ${lakh(p.v)}</title></circle>`).join("")}
    ${pts.filter(p=>p.isb).map(p=>`<circle cx="${x(p.v)}" cy="30" r="5.5" fill="var(--isb)" stroke="var(--paper)" stroke-width="2"><title>ISB: ${esc(p.n)} · ${lakh(p.v)}</title></circle>`).join("")}
    ${pts.filter(p=>p.me).map(p=>`<circle cx="${x(p.v)}" cy="30" r="7" fill="var(--paper)" stroke="var(--isb)" stroke-width="2.5"><title>Your proposal · ${lakh(p.v)}</title></circle>`).join("")}
  </svg>`;
}

/* one row pattern for programmes everywhere */
const COMPACT="--cols:minmax(0,1fr) 92px 78px 70px";
function progRow(p,opt={}){
  const s=SC[p.sc];
  return `<a class="r ${p.sc==="isb"?"isbrow":""}" href="#/p/${p.i}" style="${opt.compact?COMPACT:""}">
    <span><div class="n">${esc(p.n)}${newTag(p.launch)}${p.new?'<span class="mark">added this month</span>':""}</div>
      <div class="s">${esc(s.l)}${p.pt?` · with ${esc(p.pt)}`:""}${opt.topic?` · ${esc(T[p.t].n)}`:""}</div></span>
    <span class="c hm">${esc(p.f==="Self-paced Online"?"Self-paced":p.f)}</span><span class="c hm">${wk(p.w)}</span>
    <span class="c">${p.inr?lakh(p.inr):"—"}</span>${opt.compact?"":`<span class="c hm">${p.ns?fmtD(p.ns):"—"}</span>`}</a>`;
}
const progHead=(c)=>c?`<div class="r hd" style="${COMPACT}"><span>Programme</span><span>Format</span><span>Length</span><span>Fee</span></div>`
  :`<div class="r hd"><span>Programme</span><span>Format</span><span>Length</span><span>Fee</span><span>Next start</span></div>`;

/* ---------- the brief ---------- */
function pricePositions(){
  return D.progs.filter(p=>p.sc==="isb"&&p.inr).map(p=>{const f=closest(p).map(q=>q.inr).filter(Boolean);
    return f.length>=3?{p,med:median(f),n:f.length,gap:100*(p.inr/median(f)-1)}:null;}).filter(Boolean);
}
function brief(){
  const L=D.launches, out=[];
  if(L){
    const r3=L.rows.filter(r=>r.eff&&r.eff>=addM(L.asof,-3));
    const ai=r3.filter(r=>isAI(r.n)).length;
    const who=[...new Set(r3.map(r=>SC[r.sc].l))];
    out.push({h:`Peers launched <b>${plural(r3.length,"new programme")}</b> in the three months to ${fmtD(L.asof)}${ai?`, and ${ai} of them ${ai===1?"is":"are"} about AI`:""}.`,
      d:`${who.join(", ")}. A further ${L.rows.filter(r=>!r.eff).length} are marked new by their schools but carry no launch date.`,go:["#/launches?w=3","See the launches"]});
  }
  const leads=D.topics.filter(t=>t.call==="LEAD").sort((a,b)=>b.dem-a.dem), lead=leads[0];
  if(lead) out.push({h:`The strongest unmet demand we track is <b>${esc(lead.n)}</b>: ${plural(lead.srcs,"independent report")} say employers need it, and ${lead.peers?`only ${plural(lead.peers,"other school")} ${lead.peers===1?"sells":"sell"} it`:"no school we track sells it"}.`,
    d:`ISB does not sell it either. ${leads.length-1} more topics share this profile.`,go:[`#/topic/${lead.id}`,"Open the topic"]});
  const def=D.topics.filter(t=>t.call==="DEFEND").sort((a,b)=>b.peers-a.peers)[0];
  if(def) out.push({h:`ISB's most contested ground is <b>${esc(def.n)}</b>: ${plural(def.isb,"ISB programme")} against ${def.peers} other schools.`,
    d:`Published research shows ${DEM(def).toLowerCase()} demand for it (${plural(def.srcs,"independent report")}).`,go:[`#/topic/${def.id}`,"See who sells it"]});
  const isb=D.progs.filter(p=>p.sc==="isb");
  const zero=D.themes.filter(th=>!isb.some(p=>T[p.t].th===th));
  if(zero.length){const n=D.progs.filter(p=>zero.includes(T[p.t].th)).length;
    out.push({h:`ISB sells nothing in <b>${zero.join("; ").replace(/; ([^;]*)$/," or $1")}</b>, where other schools sell ${n} programmes.`,
      d:`Every other theme has at least one ISB programme.`,go:["#/portfolio","See where ISB stands"]});}
  const pp=pricePositions().sort((a,b)=>b.gap-a.gap);
  if(pp.length){const above=pp.filter(x=>x.gap>0).length;
    out.push({h:`On <b>${above} of ${pp.length}</b> ISB programmes with a published fee, ISB charges more than the median of its closest peers.`,
      d:`Widest gap: ${esc(pp[0].p.n)}, ${Math.round(pp[0].gap)}% above.`,go:["#/portfolio?at=price","See every programme's position"]});}
  const c=D.changes;
  if(c){const isbA=c.added.filter(x=>x[0]==="isb").length, pa=c.added.length-isbA;
    const bits=[isbA&&`ISB added ${isbA} programmes`,pa&&`other schools added ${pa}`,c.dropped.length&&`${c.dropped.length} dropped`,c.repriced.length&&`${c.repriced.length} repriced`,(c.calls||[]).length&&plural(c.calls.length,"call")+" moved"].filter(Boolean);
    out.push({h:`Since ${fmtD(c.since)}: ${bits.length?bits.join(", "):"no catalogue changes"}.`,d:`The catalogue refreshes on the 1st of each month. Next: ${esc(D.whatsnew.next)}.`,go:["#/updates","See all updates"]});}
  $("view").innerHTML=`<div class="read">
    <h1>Monthly brief</h1>
    <p class="kicker">What changed in the market and what it means for ISB · ${esc(D.whatsnew.ran)} · ${D.progs.length} programmes from ISB and ${D.schools.length-1} other schools</p>
    ${out.map((s,i)=>`<div class="st ${i?"":"first"}"><p class="lead">${s.h}</p><p class="meta">${s.d}</p><a class="go" href="${s.go[0]}">${s.go[1]} →</a></div>`).join("")}
  </div>
  <div class="doors">
    <a href="#/"><b>Search programmes</b><span>Find any of ${D.progs.length} programmes by topic, role, school or keyword.</span></a>
    <a href="#/test"><b>Test a programme idea</b><span>Describe an idea and see who already sells something similar, at what price, and whether there is demand.</span></a>
    <a href="#/portfolio"><b>Where ISB stands</b><span>Where ISB should lead, follow, diversify, deepen or defend, and how it is priced.</span></a>
  </div>`;
}

/* ---------- topic ---------- */
function topic(id){
  const t=T[id]; if(!t) return notFound();
  const all=D.progs.filter(p=>p.t===id||p.sec===id), isb=all.filter(p=>p.sc==="isb"), peers=all.filter(p=>p.sc!=="isb");
  const grp=g=>peers.filter(p=>SC[p.sc].g===g).sort((a,b)=>(b.inr||0)-(a.inr||0));
  const mv=movedCall[id], f=peers.map(p=>p.inr).filter(Boolean);
  $("view").innerHTML=`<p class="meta"><a href="#/portfolio">${esc(t.th)}</a> · ${esc(t.st)}${t.ai!=="Stable"?" · AI-era topic":""}</p>
    <h1 class="read">${esc(t.n)}</h1>
    <p class="lead read">${callLine(t)}${mv?` <span class="meta">(was ${mv[0]?CALL[mv[0]]:"no call"} last month)</span>`:""}</p>
    <dl class="facts">
      <div><dt>Market demand</dt><dd>${demText(t)}</dd></div>
      <div><dt>Other schools selling it</dt><dd>${t.peers||"none"}</dd></div>
      <div><dt>ISB</dt><dd class="${isb.length?"isb":"none"}">${(()=>{const o=isbOn(id);return o.sold.length?plural(o.sold.length,"programme")+(o.part.length?`, plus ${o.part.length} as a module`:""):o.part.length?`only as a module in ${o.part.length}`:"nothing";})()}</dd></div>
      <div><dt>What other schools charge</dt><dd>${f.length?`typically ${lakh(median(f))} (middle of ${f.length} published fees)`:"no fees published"}</dd></div>
    </dl>
    <p class="explain">${DEM_EXPLAIN}</p>
    ${strip(all)}
    <section><header><h2>ISB</h2></header>
      ${isb.length?`<div class="rows">${progHead()}${isb.map(p=>progRow(p)).join("")}</div>`:`<p class="meta">ISB sells nothing whose main or secondary topic is this.</p>`}</section>
    ${["India","Global","Platform"].map(g=>{const l=grp(g);return l.length?`<section><header><h2>${{India:"Indian schools",Global:"Global schools",Platform:"Platforms"}[g]}</h2><span class="meta">${l.length}</span></header>
      <div class="rows">${progHead()}${l.map(p=>progRow(p)).join("")}</div></section>`:"";}).join("")}
    <section class="read"><header><h2>The evidence</h2></header>
      <p>${t.dsl?esc(t.dsl):"No published demand source maps to this topic."}${t.geo?` <span class="meta">(${esc(t.geo.replace(/;/g,", "))})</span>`:""}</p>
      ${t.out!=null?`<p class="meta">Our 2027-31 outlook is ${t.out} out of 5. That is a judgment, not evidence: ${esc(t.why2)}</p>`:""}
      ${t.resid?`<p class="meta">Some programmes landed here on a broad keyword match, so the count of other schools may be inflated.</p>`:""}
      <p class="meta">The call comes from three facts: whether ISB sells it, how many other schools sell it (as a programme or a module inside one), and how much published research says employers need it.</p>
      <p><a href="#/test?topic=${t.id}">Test a programme idea in this topic →</a></p></section>`;
}

/* ---------- programme ---------- */
function programme(i){
  const p=D.progs[+i]; if(!p) return notFound();
  const t=T[p.t], peers=closest(p), f=peers.map(q=>q.inr).filter(Boolean), med=median(f);
  const row=(k,v)=>`<div><dt>${k}</dt><dd class="${v?"":"none"}">${v||"not published"}</dd></div>`;
  const feats=[p.cap==="Yes"&&"capstone",p.imm==="Yes"&&"campus immersion",p.iv==="Yes"&&"industry visit"].filter(Boolean);
  $("view").innerHTML=`<p class="meta"><span class="${p.sc==="isb"?"isb":""}">${esc(SC[p.sc].n)}</span> · <a href="#/topic/${p.t}">${esc(t.n)}</a></p>
    <h1 class="read">${esc(p.n)}</h1>
    ${p.inr&&med&&f.length>=3?`<p class="lead read">${lakh(p.inr)}, ${p.inr>med?`${Math.round(100*(p.inr/med-1))}% above`:`${Math.round(100*(1-p.inr/med))}% below`} the typical fee of the ${f.length} most similar programmes at other schools.</p>`:""}
    <dl class="facts">${row("Format",esc(p.f))}${row("Length",esc(p.dr||(p.w?wk(p.w):"")))}${row("Fee as published",esc(p.fr))}
      ${row("Level",esc(LV(p.lv)))}${row("Next start",p.ns?fmtD(p.ns):"")}${row("Delivered with",esc(p.pt))}${row("Includes",feats.join(", "))}${row("Topic call",t.call?CALL[t.call]:"")}</dl>
    ${p.ta?`<p class="read"><span class="meta">For </span>${esc(p.ta)}</p>`:""}
    ${p.kt?`<p class="read"><span class="meta">Teaches </span>${esc(p.kt.split(";").map(x=>x.trim()).filter(Boolean).join(", "))}</p>`:""}
    ${strip([p,...peers])}
    <section><header><h2>Most similar programmes at other schools</h2><span class="meta">matched on topic, then format, level and length</span></header>
      ${peers.length?`<div class="rows">${progHead()}${peers.map(q=>progRow(q)).join("")}</div>`:`<p class="meta">No other school sells a programme in the same topic or sub-theme.</p>`}</section>
    <p class="meta" style="margin-top:28px">${p.u?`<a href="${esc(p.u)}" target="_blank" rel="noopener">Source page</a> · `:""}${
      p.prov==="team-sheet"?"From the team's competitor sheet"+(p.lvf?`, confirmed ${fmtD(p.lvf)}`:", not yet confirmed on a live page"):`Captured from the school's catalogue${p.lvf?`, verified ${fmtD(p.lvf)}`:""}`}.${
      p.conf==="low"||p.conf==="fallback"?" Topic matched on a broad keyword; check it before quoting.":""}</p>`;
}

/* ---------- where ISB stands ---------- */
const openTh=new Set();
function portfolio(){
  const isb=D.progs.filter(p=>p.sc==="isb");
  const sizes=D.schools.filter(s=>s.g==="India"||s.g==="Global").map(s=>D.progs.filter(p=>p.sc===s.s).length);
  const aiShare=l=>l.length?100*l.filter(p=>T[p.t].ai!=="Stable").length/l.length:0;
  const peerAi=median(D.schools.filter(s=>s.g!=="ISB").map(s=>D.progs.filter(p=>p.sc===s.s)).filter(l=>l.length>=15).map(aiShare));
  const groups=["LEAD","DIVERSIFY","FOLLOW","DEEPEN","DEFEND"].map(c=>[c,D.topics.filter(t=>t.call===c).sort((a,b)=>b.dem-a.dem)]);
  const rest=D.topics.filter(t=>t.call==="WATCH"||t.call==="REVIEW");
  const peers=D.progs.filter(p=>p.sc!=="isb");
  const share=(l,th)=>l.length?100*l.filter(p=>T[p.t].th===th).length/l.length:0;
  const W=D.themes.map(th=>({th,a:share(isb,th),b:share(peers,th)})).sort((x,y)=>(y.b-y.a)-(x.b-x.a));
  const mx=Math.max(...W.flatMap(r=>[r.a,r.b]));
  const X=v=>(100*v/mx).toFixed(1)+"%";
  const pp=pricePositions().sort((a,b)=>b.gap-a.gap);
  const tcols="--cols:minmax(0,1fr) 150px 130px 80px";
  $("view").innerHTML=`<h1 class="read">Where ISB stands</h1>
    <p class="lead read">ISB sells ${isb.length} programmes; the typical school we track sells ${median(sizes)}. ${Math.round(aiShare(isb))}% of ISB's catalogue is in AI-era topics, against ${Math.round(peerAi)}% at the typical school.</p>
    <p class="read" style="color:var(--ink-2)">Each topic gets one call from three facts: whether ISB sells it, how many other schools sell it, and how much published research says employers need it.</p>
    <p class="explain">${DEM_EXPLAIN}</p>
    ${groups.map(([c,l])=>`<section><header><h2>${pill(c)}</h2><span style="font-size:15px;color:var(--ink-2)">${CALLSAYS[c]}</span></header>
      <div class="rows">${l.map(t=>`<a class="r" href="#/topic/${t.id}" style="${tcols}">
        <span><div class="n">${esc(t.n)}${movedCall[t.id]?'<span class="mark">call moved</span>':""}</div><div class="s">${esc(t.th)}</div></span>
        <span class="c hm">${DEM(t)} demand</span><span class="c">${t.peers?plural(t.peers,"other school"):"no other school"}</span><span class="c ${t.isb?"isb":""}">ISB: ${t.isb||"none"}</span></a>`).join("")||`<p class="meta">None.</p>`}</div></section>`).join("")}
    <details class="fold"><summary>${rest.length} more topics to watch or review</summary>
      <div class="rows" style="margin-top:10px">${rest.map(t=>`<a class="r" href="#/topic/${t.id}" style="--cols:minmax(0,1fr) 130px 80px"><span><div class="n">${esc(t.n)} ${pill(t.call)}</div><div class="s">${esc(t.th)}</div></span><span class="c">${plural(t.peers,"other school")}</span><span class="c">ISB: ${t.isb||"none"}</span></a>`).join("")}</div></details>
    <section><header><h2>How ISB weights its catalogue</h2><span class="meta">share of ISB's programmes in each theme (<span class="isb">●</span>) against other schools' share (●), sorted by the gap</span></header>
      <div class="weights">${W.map(r=>{const lo=Math.min(r.a,r.b),hi=Math.max(r.a,r.b),g=r.b-r.a;
        return `<div class="w"><span>${esc(r.th)}</span><span class="tr"><i style="left:${X(lo)};width:calc(${X(hi)} - ${X(lo)})"></i>
          <b style="left:${X(r.b)};background:var(--ink-3)" title="Peers ${r.b.toFixed(1)}%"></b><b style="left:${X(r.a)};background:var(--isb)" title="ISB ${r.a.toFixed(1)}%"></b></span>
          <span class="num meta" style="text-align:right">${g>0?"+":""}${g.toFixed(1)}</span></div>`;}).join("")}</div>
      <p class="meta" style="margin-top:8px">A positive gap means other schools put more of their catalogue there than ISB does, in percentage points.</p></section>
    <section id="price"><header><h2>How ISB is priced</h2><span class="meta">each ISB programme against the typical fee of the most similar programmes at other schools</span></header>
      <div class="rows"><div class="r hd" style="--cols:minmax(0,1fr) 100px 120px 70px"><span>ISB programme</span><span>ISB fee</span><span>Typical fee elsewhere</span><span>Gap</span></div>
      ${pp.map(x=>`<a class="r isbrow" href="#/p/${x.p.i}" style="--cols:minmax(0,1fr) 100px 120px 70px"><span class="n">${esc(x.p.n)}</span>
        <span class="c">${lakh(x.p.inr)}</span><span class="c hm">${lakh(x.med)} <span class="meta">(${x.n})</span></span><span class="c">${x.gap>0?"+":""}${Math.round(x.gap)}%</span></a>`).join("")}</div>
      <p class="meta" style="margin-top:8px">Fees in other currencies are converted at fixed planning rates (${Object.entries(D.fx).map(([k,v])=>k+" "+v).join(", ")}), not live rates.</p></section>
    <section><header><h2>Who sells what</h2><span class="meta">programmes by theme; click a theme for its sub-themes</span></header>
      <div class="scroll"><table class="cov" style="width:100%;border-collapse:collapse" id="cov"></table></div></section>`;
  drawCov();
}
function drawCov(){
  const cols=[["ISB",p=>p.sc==="isb"],["Indian schools",p=>SC[p.sc].g==="India"],["Global schools",p=>SC[p.sc].g==="Global"],["Platforms",p=>SC[p.sc].g==="Platform"]];
  const sub={}; D.topics.forEach(t=>(sub[t.th]=sub[t.th]||new Set()).add(t.st));
  const cell=(l,c,i)=>{const n=l.filter(c[1]).length;return `<td class="${i===0?"i":""}">${i===0&&!n?"none":n}</td>`;};
  let h=`<tr><th>Theme</th>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr>`;
  D.themes.forEach(th=>{const l=D.progs.filter(p=>T[p.t].th===th);
    h+=`<tr class="th" data-th="${esc(th)}"><td>${openTh.has(th)?"▾":"▸"} ${esc(th)}</td>${cols.map((c,i)=>cell(l,c,i)).join("")}</tr>`;
    if(openTh.has(th)) [...sub[th]].forEach(st=>{const sl=l.filter(p=>T[p.t].st===st);
      h+=`<tr class="sub"><td>${esc(st)}</td>${cols.map((c,i)=>cell(sl,c,i)).join("")}</tr>`;});});
  $("cov").innerHTML=h;
  $("cov").onclick=e=>{const tr=e.target.closest("tr.th");if(!tr)return;const k=tr.dataset.th;openTh.has(k)?openTh.delete(k):openTh.add(k);drawCov();};
}

/* ---------- peer launches ---------- */
let lWin="all", lSort="new", lConf=false, lQ="";
const LCOLS="--cols:110px minmax(0,1fr) 80px 130px 110px";
function launches(q){
  const L=D.launches; if(!L) return notFound();
  if(q.w) lWin=q.w; if(q.q!=null) lQ=q.q;
  const inW=(r,w)=>{if(w==="undated")return !r.eff; if(w==="all")return true; if(!r.eff)return false;
    if(w==="6-12")return r.eff>=L.from&&r.eff<addM(L.asof,-6); return r.eff>=addM(L.asof,-(+w));};
  const inWin=r=>inW(r,lWin);
  const key={new:r=>r.eff?-Date.parse(r.eff):1e15,old:r=>r.eff?Date.parse(r.eff):1e15,
    cohort:r=>r.fcd?Date.parse(r.fcd.length===7?r.fcd+"-01":r.fcd):1e15,
    school:r=>["hbs","wharton","insead","lbs","imd","iima","iimb","iimc","iimk","iiml"].indexOf(r.sc)*1e14+(r.eff?-Date.parse(r.eff)/1e6:0)}[lSort];
  const list=L.rows.filter(r=>inWin(r)&&(!lConf||!r.prob)&&(!lQ||hit([r.n,SC[r.sc].l,SC[r.sc].n,r.pt,r.f].join(" ").toLowerCase(),lQ)))
    .sort((a,b)=>key(a)-key(b)||a.n.localeCompare(b.n));
  const tabs=[["all","All 12 months"],["1","Last month"],["3","Last 3 months"],["6","Last 6 months"],["6-12","6 to 12 months ago"],["undated","No launch date"]];
  $("view").innerHTML=`<h1 class="read">New programmes launched by other schools</h1>
    <p class="lead read">${L.rows.length} programmes that ten leading schools had never run before, launched ${fmtD(L.from)} to ${fmtD(L.asof)}. ${L.rows.filter(r=>r.prob).length} are probable: the school marks them new but has not said when they were announced.</p>
    ${timeline(L,inWin)}
    <div class="tools"><div class="tabs" id="ltabs">${tabs.map(([w,l])=>`<button type="button" data-w="${w}" class="${lWin===w?"on":""}">${l} <span class="meta">${L.rows.filter(r=>inW(r,w)).length}</span></button>`).join("")}</div></div>
    <div class="tools">
      <label>Sort <select id="lsort"><option value="new">launch date, newest first</option><option value="old">launch date, oldest first</option><option value="cohort">first cohort, soonest first</option><option value="school">school</option></select></label>
      <label class="ck"><input type="checkbox" id="lconf" ${lConf?"checked":""}> confirmed only</label>
      <input type="search" id="lq" placeholder="Search launches" value="${esc(lQ)}" aria-label="Search launches">
      <span class="meta">${list.length} shown</span>
    </div>
    <div class="rows">
      <div class="r hd" style="${LCOLS}"><span>Launched</span><span>Programme</span><span>School</span><span>First cohort</span><span>Fee</span></div>
      ${list.map(r=>`<details class="r ${r.prob?"prob":""}" style="${LCOLS}"><summary>
        <span class="c">${r.basis==="launch"?fmtD(r.ld):r.basis==="first cohort"?fmtD(r.eff)+'<div class="s">first cohort ran</div>':'<span class="meta">not published</span>'}</span>
        <span><div class="n">${esc(r.n)}${r.prob?'<span class="mark">probable</span>':""}</div><div class="s">${esc(r.ev)}</div></span>
        <span class="c">${esc(SC[r.sc].l)}</span><span class="c hm">${esc(r.fc)}</span><span class="c hm">${esc(r.fee)}</span></summary>

/* the year as a line: each dated launch is a dot on its date, Indian schools

function timeline(L,inWin){
  const W=1000,H=124,l=60,r=12, t0=Date.parse(L.from), t1=Date.parse(L.asof);
  const x=s=>l+(W-l-r)*(Date.parse(s.length===7?s+"-01":s)-t0)/(t1-t0);
  const lanes={India:40,Global:84};
  const months=[]; for(let m=0;m<=13;m++){const d=addM(L.from,m).slice(0,7)+"-01"; if(Date.parse(d)>=t0&&Date.parse(d)<=t1) months.push(d);}
  const sel=lWin==="all"||lWin==="undated"?null:lWin==="6-12"?[L.from,addM(L.asof,-6)]:[addM(L.asof,-(+lWin)),L.asof];
  const stack={};
  const dots=L.rows.filter(r=>r.eff&&SC[r.sc].g in lanes).map(r=>{const g=SC[r.sc].g,k=g+Math.round(x(r.eff)/9);stack[k]=(stack[k]||0)+1;
    const y=lanes[g]+(g==="India"?-1:1)*(stack[k]-1)*8, on=inWin(r);
    return `<circle cx="${x(r.eff).toFixed(1)}" cy="${y}" r="3.6" fill="${on?"var(--ink)":"var(--ink-3)"}" fill-opacity="${on?1:.35}"><title>${esc(SC[r.sc].l)}: ${esc(r.n)} · ${fmtD(r.eff)}</title></circle>`;}).join("");
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:620px;height:auto;margin:10px 0 18px" role="img" aria-label="Dated launches by other schools across the year">
    ${sel?`<rect x="${x(sel[0])}" y="8" width="${x(sel[1])-x(sel[0])}" height="${H-34}" fill="var(--wash)"/>`:""}
    <line x1="${l}" x2="${W-r}" y1="62" y2="62" stroke="var(--rule)"/>
    ${months.map(m=>`<line x1="${x(m)}" x2="${x(m)}" y1="58" y2="66" stroke="var(--rule)"/><text x="${x(m)}" y="${H-4}" text-anchor="middle">${new Date(m+"T00:00:00").toLocaleDateString("en-GB",{month:"short"})}</text>`).join("")}
    <text x="0" y="${lanes.India+4}">Indian</text><text x="0" y="${lanes.Global+4}">Global</text>
    ${dots}</svg></div>`;
}

      <div><dt>Market demand</dt><dd>${demText(t)}</dd></div>
      <div><dt>Your fee</dt><dd>${fee?lakh(fee)+(fees.length?`; ${fee>med?"above":"below"} the typical ${lakh(med)} of ${fees.length} similar programmes`:""):"not set"}</dd></div>
      <div><dt>Your length</dt><dd>${w?wk(w)+(mlen?`; similar programmes typically run ${wk(mlen)}`:""):"not set"}</dd></div>
      <div><dt>How similar programmes are taught</dt><dd>${Object.entries(fmts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${n} ${k.toLowerCase()}`).join(", ")||"none"}</dd></div>
    </dl>
    ${strip(comps,fee)}
    ${fee&&fees.length?`<p class="meta">Your idea is the open circle; grey dots are similar programmes at other schools, by fee.</p>`:""}
    <section style="margin-top:36px"><header><h2>Programmes you would compete with</h2><span class="meta">the closest ones already on sale at other schools</span></header>
      ${comps.length?`<div class="rows">${progHead(1)}${comps.map(p=>progRow(p,{compact:1})).join("")}</div>`:`<p class="meta">Nothing comparable on sale in this topic or its sub-theme.</p>`}</section>
    <section><header><h2>ISB's own programmes nearby</h2></header>
      ${isbHere.length||isbNear.length?`<div class="rows">${progHead(1)}${[...isbHere,...isbNear].map(p=>progRow(p,{compact:1})).join("")}</div>
        <p class="meta" style="margin-top:6px">${isbOn(t.id).sold.length?"Same topic: check for overlap before launching.":isbHere.length?"These teach the topic as a module; a dedicated programme would sit next to them.":"Same sub-theme, different topic: a natural place to extend from."}</p>`:`<p class="meta">ISB sells nothing in this topic or its sub-theme.</p>`}</section>
    <section><header><h2>Similar launches by other schools in the last year</h2></header>
      ${recent.length?`<div class="rows">${recent.map(r=>`<a class="r ${r.prob?"prob":""}" href="${esc(r.u)}" target="_blank" rel="noopener" style="--cols:minmax(0,1fr) 80px 120px">
        <span><div class="n">${esc(r.n)}</div><div class="s">${esc(r.ev)}</div></span><span class="c">${esc(SC[r.sc].l)}</span><span class="c">${r.ld?fmtD(r.ld):r.prob?"probable":fmtD(r.eff)}</span></a>`).join("")}</div>
        <p class="meta" style="margin-top:6px">Matched on shared words in the title and description, so check each one.</p>`:`<p class="meta">None of the ${L?L.rows.length:0} launches by other schools in the last year shares two or more key words with this idea.</p>`}</section>`;
}

/* ---------- updates ---------- */
function updates(){
  const c=D.changes;
  const lst=(h,l)=>l&&l.length?`<section><header><h2>${h}</h2><span class="meta">${l.length}</span></header><div class="rows">${l.map(x=>{const p=D.progs.find(q=>q.sc===x[0]&&q.n===x[1]);
    return `<${p?`a href="#/p/${p.i}"`:"div"} class="r" style="--cols:80px minmax(0,1fr)"><span class="c">${esc(SC[x[0]]?SC[x[0]].l:x[0])}</span><span class="n">${esc(x[1])}${x[2]&&x[3]?` <span class="meta">${esc(x[2])} → ${esc(x[3])}</span>`:""}</span></${p?"a":"div"}>`;}).join("")}</div></section>`:"";
  $("view").innerHTML=`<h1 class="read">Updates</h1>
    <p class="lead read">The catalogue refreshes on the 1st of each month and is compared with the month before. Last refresh ${esc(D.whatsnew.ran)}; next ${esc(D.whatsnew.next)}.</p>
    ${c?lst(`Added since ${fmtD(c.since)}`,c.added)+lst("Dropped",c.dropped)+lst("Repriced",c.repriced)+
      ((c.calls||[]).length?`<section><header><h2>Calls that moved</h2></header><div class="rows">${c.calls.map(([id,o,n])=>T[id]?`<a class="r" href="#/topic/${id}" style="--cols:minmax(0,1fr) 200px"><span class="n">${esc(T[id].n)}</span><span class="c">${o?CALL[o]:"no call"} → ${n?CALL[n]:"no call"}</span></a>`:"").join("")}</div></section>`:""):""}
    <section><header><h2>Log</h2></header><div class="rows">${D.whatsnew.log.map(e=>`<div class="r" style="--cols:110px minmax(0,1fr)"><span class="c">${fmtD(e.date)}</span><span><div class="n">${esc(e.headline)}</div><div class="s">${esc(e.detail)}</div></span></div>`).join("")}</div></section>
    <p class="meta" style="margin-top:22px">${D.quality.queue} gaps (missing fees, lengths or start dates) are queued for the next refresh.</p>`;
}
function notFound(){$("view").innerHTML=`<h1>Not found</h1><p><a href="#/">Back to search</a></p>`;}

/* ---------- find ---------- */
let hitOn=0;
function find(qs){
  const box=$("hits"); if(!qs.trim()){box.hidden=true;return;}
  const tops=D.topics.filter(t=>hit([t.n,t.st,t.th].join(" ").toLowerCase(),qs)).slice(0,5).map(t=>({h:`#/topic/${t.id}`,n:t.n,s:`Topic · ${t.call?CALL[t.call]:"no call"} · ${DEM(t)} demand · ${plural(t.peers,"other school")}`}));
  const sch=D.schools.filter(s=>hit((s.n+" "+s.l).toLowerCase(),qs)).slice(0,3).map(s=>({h:`#/?sc=${s.s}`,n:s.n,s:`All ${D.progs.filter(p=>p.sc===s.s).length} programmes`}));
  const pr=D.progs.filter(p=>hit([p.n,T[p.t].n,SC[p.sc].l,SC[p.sc].n,p.pt].join(" ").toLowerCase(),qs))
    .sort((a,b)=>(a.sc==="isb"?0:1)-(b.sc==="isb"?0:1)).slice(0,7).map(p=>({h:`#/p/${p.i}`,n:p.n,s:`${SC[p.sc].l} · ${p.f} · ${p.inr?lakh(p.inr):"fee not published"}`}));
  const la=D.launches?D.launches.rows.filter(r=>hit([r.n,SC[r.sc].l].join(" ").toLowerCase(),qs)).slice(0,3).map(r=>({h:`#/launches?q=${encodeURIComponent(qs)}`,n:r.n,s:`New at ${SC[r.sc].l} · ${r.ld?fmtD(r.ld):"launch date not published"}`})):[];
  hitOn=0; let i=0;
  const g=(h,l)=>l.length?`<div class="g">${h}</div>`+l.map(x=>`<a href="${x.h}" data-i="${i}" class="${i++===0?"on":""}">${esc(x.n)}<span>${esc(x.s)}</span></a>`).join(""):"";
  const any=tops.length+sch.length+pr.length+la.length;
  box.innerHTML=any?g("Topics",tops)+g("Schools",sch)+g("Programmes",pr)+g("Peer launches",la)
    +`<a href="#/?q=${encodeURIComponent(qs)}" data-i="${i}">Every programme matching “${esc(qs)}”</a>`
    :`<div class="g">Nothing matches “${esc(qs)}”.</div>`;
  box.hidden=false;
}
const fi=$("find");
fi.addEventListener("input",()=>find(fi.value));
fi.addEventListener("focus",()=>{if(fi.value)find(fi.value);});
fi.addEventListener("keydown",e=>{
  const as=[...$("hits").querySelectorAll("a[data-i]")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hitOn=Math.max(0,Math.min(as.length-1,hitOn+(e.key==="ArrowDown"?1:-1)));as.forEach((a,j)=>a.classList.toggle("on",j===hitOn));}
  if(e.key==="Enter"){e.preventDefault();const a=as[hitOn]||as[0];if(a){location.hash=a.getAttribute("href").slice(1);$("hits").hidden=true;fi.value="";fi.blur();}}
  if(e.key==="Escape"){$("hits").hidden=true;fi.blur();}
});
document.addEventListener("click",e=>{if(e.target.closest("#hits a")){$("hits").hidden=true;fi.value="";}else if(!e.target.closest(".find"))$("hits").hidden=true;});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();fi.focus();}});

/* ---------- routing ---------- */
function route(){
  const h=location.hash.replace(/^#/,"")||"/";
  const [path,qs]=h.split("?"); const q=Object.fromEntries(new URLSearchParams(qs||""));
  const parts=path.split("/").filter(Boolean), at=parts[0]||"";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#/"+(at==="programmes"?"":at)));
  document.body.classList.toggle("home",at===""||at==="programmes");
  ({"":()=>search(q),programmes:()=>search(q),brief,portfolio,launches:()=>launches(q),test:()=>test(q),updates,
    topic:()=>topic(parts[1]),p:()=>programme(parts[1])}[at]||notFound)();
  if(q.at&&$(q.at)) $(q.at).scrollIntoView(); else window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("foot").innerHTML=`<p>Built from ${D.schools.length} schools' and platforms' own catalogues, ${D.quality.signals} published demand signals and the Product Team's register of new launches. ISB's programmes are checked against live pages; other schools' catalogues are captured in bulk and tagged by keyword, so their counts are indicative. There is no ISB enrolment, revenue or feedback data here yet. Fees in other currencies use fixed planning rates set on ${esc(D.fxDate)}. Out of scope: degree programmes, custom programmes, Coursera and edX.</p>
  <p><a href="#/updates">Updates</a> · refreshed ${esc(D.whatsnew.ran)}</p>`;
route();
</script>
